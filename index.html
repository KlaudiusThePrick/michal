    <h1>úvod</h1>
    <h3>vec: oznámenie o obsahu</h3>
    <div id="obsah">
        <p><em>text</em></p>
    </div>

    <script>
        fetch("index.txt")
            .then(function (response) {
                return response.text();
            })
            .then(function (text) {
                var lines = text.split(/\r?\n/);
                var html = "";

                for (var i = 0; i < lines.length; i++) {
                    var line = lines[i];

                    if (line.indexOf("## ") === 0) {
                        html += "<h3>" + line.slice(3) + "</h3>\n";
                    } else if (line.indexOf("# ") === 0) {
                        html += "<h2>" + line.slice(2) + "</h2>\n";
                    } else if (line.indexOf("foto ") === 0) {
                        var subor = line.slice(5).trim();
                        var alt = subor.replace(/\.[a-zA-Z0-9]+$/, "").replace(/[-_]/g, " ");
                        html += '<img src="' + subor + '" alt="' + alt + '" loading="lazy">\n';
                    } else {
                        html += "<p>" + line + "</p>\n";
                    }
                }

                document.getElementById("obsah").innerHTML = html;
            })
            .catch(function (err) {
                document.getElementById("obsah").innerHTML =
                    "<p><em>textový súbor sa nepodarilo načítať (funguje to len cez skutočný hosting, nie pri otvorení súboru priamo z disku).</em></p>";
            });
                    fetch("statusy.txt")
            .then(function (response) {
                return response.text();
            })
            .then(function (text) {
                var lines = text.split(/\r?\n/).filter(function (line) {
                    return line.trim() !== "";
                });

                lines.reverse(); // najnovší status (posledný riadok v súbore) hore

                var html = "";
                for (var i = 0; i < lines.length; i++) {
                    html += "<p>" + lines[i] + "</p>\n";
                }

                document.getElementById("statusy").innerHTML =
                    html || "<p><em>zatiaľ žiadne statusy.</em></p>";
            })
            .catch(function (err) {
                document.getElementById("statusy").innerHTML =
                    "<p><em>statusy.txt sa nepodarilo načítať.</em></p>";
            });
    </script>
